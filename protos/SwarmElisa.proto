#VRML_SIM R2025a utf8
# An Elisa-3 for the examples of phyelds, run by the controller phyelds_swarm. Its own radio
# reaches the whole arena, so it gets the devices of SwarmDevices: a radio that reaches only the
# robots nearby, a GPS, an inertial unit, and two light sensors looking up.

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/gctronic/elisa/protos/Elisa3.proto"
EXTERNPROTO "SwarmDevices.proto"

PROTO SwarmElisa [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   name           "elisa"
  field MFString   controllerArgs ["gradient"]   # The program the robot runs.
  field SFFloat    radioRange     0.17           # How far, in metres, the radio reaches.
]
{
  Elisa3 {
    translation IS translation
    rotation IS rotation
    name IS name
    controller "phyelds_swarm"
    controllerArgs IS controllerArgs
    extensionSlot [
      SwarmDevices {
        radioRange IS radioRange
      }
    ]
  }
}
