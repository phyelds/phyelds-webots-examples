#VRML_SIM R2025a utf8
# A Thymio II for the examples of phyelds, run by the controller phyelds_swarm, with the devices
# of SwarmDevices in its body. Its wheels are 21 mm in radius, and its motors have names of their
# own: its arguments say so.

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/mobsya/thymio/protos/Thymio2.proto"
EXTERNPROTO "SwarmDevices.proto"

PROTO SwarmThymio [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   name           "thymio"
  field MFString   controllerArgs ["gradient", "--wheel-radius", "0.021", "--wheels", "motor.left", "motor.right"]
  field SFFloat    radioRange     0.17  # How far, in metres, the radio reaches.
]
{
  Thymio2 {
    translation IS translation
    rotation IS rotation
    name IS name
    controller "phyelds_swarm"
    controllerArgs IS controllerArgs
    bodySlot [
      SwarmDevices {
        radioRange IS radioRange
      }
    ]
  }
}
